name: SignApp CI/CD

on:
  push:
    branches: [ main ]

jobs:

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çək
        uses: actions/checkout@v4

      - name: Docker Hub-a login ol
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: API image build et və push et
        uses: docker/build-push-action@v5
        with:
          context: ./api/SignApp.API
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/signapp-api:latest

      - name: UI image build et və push et
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/signapp-ui:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH ilə EC2-yə deploy et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            mkdir -p ~/signapp
            cd ~/signapp

            cat > docker-compose.yml << 'EOF'
            version: '3.9'
            services:
              mssql:
                image: mcr.microsoft.com/mssql/server:2022-latest
                environment:
                  ACCEPT_EULA: "Y"
                  SA_PASSWORD: "SignApp@12345"
                ports:
                  - "1433:1433"
                healthcheck:
                  test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SignApp@12345" -C -Q "SELECT 1" || exit 1
                  interval: 10s
                  retries: 10
                  start_period: 30s
              api:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/signapp-api:latest
                ports:
                  - "8080:8080"
                environment:
                  ConnectionStrings__DefaultConnection: "Server=mssql;Database=SignAppDb;User Id=sa;Password=SignApp@12345;TrustServerCertificate=True;"
                depends_on:
                  mssql:
                    condition: service_healthy
                restart: on-failure
              ui:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/signapp-ui:latest
                ports:
                  - "3001:80"
                depends_on:
                  - api
                restart: on-failure
            volumes:
              mssql_data:
            EOF

            docker-compose down || true
            docker-compose pull
            docker-compose up -d